<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Scandiweb Testing Tool</title>
    <link rel="stylesheet" href="public/assets/output.css">
</head>

<body class="min-h-screen">
    <div
      id="shadow-overlay"
      class="bg-gray-700/50 w-screen h-screen absolute top-0 left-0 transition-opacity ease-in-out pointer-events-none"
      style="opacity: 0"
    ></div>
    <div
      id="loader-holder"
      class="absolute left-1/2 transform -translate-x-1/2 -translate-y-1/2 rounded-md overflow-hidden transition-all ease-in-out w-[550px]"
      style="top: -300px"
    >
        <div class="relative">
            <img src="public/assets/images/cat_working.webp" alt="cat working" class="w-full h-auto">
            <div
                class="absolute bottom-[60px] left-1/2 -translate-x-1/2 text-gray-50 text-xl w-full text-center"
            >
                Our AutoQA is doing it's best
            </div>
            <div
                class="absolute bottom-[34px] left-1/2 -translate-x-1/2 text-gray-50 text-xl w-full text-center"
            >
                Please wait a couple of minutes
            </div>
        </div>
    </div>
    <div>
        <div class="flex flex-col justify-center items-center pt-24">
            <div>
                <h2 class="text-[#e04f4f] text-[64px] font-bold text-center">scandiweb</h2>
                <div>
                    <h3 class="text-[28px] mt-6 text-gray-900">Please select the test type and enter the URL</h3>
                </div>
                <form
                  id="special-form"
                  name="url-form"
                  class="mt-10 flex flex-col items-center gap-y-[22px]"
                >
                    <div class="grid w-full grid-cols-[30%_70%]">
                        <label class="text-gray-900 text-[22px]" for="testType">Test type:</label>
                        <select
                          class="border-gray-300 border-[1px] rounded h-[38px] bg-gray-50 text-[22px] px-[5px] focus:outline-none focus:border-blue-200 focus:border-2"
                          id="testType" name="testType"
                        >
                            <option value="junior-web-required">Web Developer(Mandatory)</option>
                            <option value="junior-web-advanced">Advanced Web Developer(Optional)</option>
                            <option value="full-stack" selected>Full-Stack Developer</option>
                        </select>
                    </div>

                    <div class="grid w-full grid-cols-[30%_70%] grid-rows-[1fr_16px]">
                        <label class="text-gray-900 text-[22px]" for="linkToTest">URL to Test:</label>
                        <input
                          class="border-gray-300 border-[1px] rounded h-[38px] bg-gray-50 text-xl px-[8px] focus:outline-none focus:border-blue-200 focus:border-2"
                          type="text"
                          id="linkToTest"
                          name="linkToTest"
                          required
                        />
                        <div style="display: none" id="url-error" class="col-start-2 text-red-400">URL has invalid format</div>
                    </div>
                    <button
                      class="mt-4 font-medium bg-red-500 text-gray-100 text-[24px] w-[38%] rounded-[10px] border-[1px] py-[8px] hover:bg-red-600 transition shadow-lg focus:outline-none"
                      onclick="onFormSubmit(event)"
                    >
                        Send for QA
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div>
</div>
<script>
    function onFormSubmit(event) {
        event.preventDefault();

        let shadowOverlay = document.getElementById("shadow-overlay");
        let loader = document.getElementById("loader-holder");
        let error = document.getElementById("url-error");
        let linkToTest = document.getElementById("linkToTest");

        if (!validateForm()) {
            error.style.display = "block";
            linkToTest.style.borderColor = "#f87171";

            return false;
        }

        loader.style.animationName = "fromTopToCenter";
        loader.style.animationDuration = "1s";
        loader.style.animationFillMode = "forwards";
        shadowOverlay.style.opacity = "1";

        // turn FormData into JSON
        const formData = new FormData(document.getElementById("special-form"));
        const formDataJson = Object.fromEntries(formData.entries());

        fetch("/submit-form", {
          method: "POST",
          body: JSON.stringify(formDataJson),
          headers: {
            "Content-Type": "application/json",
          }
        })
          .then(response => response.json())
          .then(data => {
            if (!data.redirectUrl) {
              throw new Error("No redirect URL");
            }

            window.location.href = data.redirectUrl;
          })
          .catch(error => {
            console.error("Error:", error);
          });
    }

    function validateForm() {
        let urlToCheck = document.forms["url-form"]["linkToTest"].value;

        let pattern = new RegExp('^((http|https)?:\\/\\/)?' + // protocol
            '((([a-z\\d]([a-z\\d-]*[a-z\\d])*)\\.)+[a-z]{2,}|' + // domain name
            '((\\d{1,3}\\.){3}\\d{1,3}))' + // OR ip (v4) address
            '(\\:\\d+)?(\\/[-a-z\\d%_.~+]*)*' + // port and path
            '(\\?[;&a-z\\d%_.~+=-]*)?' + // query string
            '(\\#[-a-z\\d_]*)?$', 'i'); // fragment locator

        return pattern.test(urlToCheck);
    }

    document.querySelector("#special-form").addEventListener("click", function (event) {
        event.preventDefault();
    });
</script>
</body>
</html>
